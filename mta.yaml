_schema-version: 3.3.0
ID: Livraria
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: Livraria-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: Livraria-auth
      - name: Livraria-db
      - name: Livraria-destination

  - name: Livraria-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: Livrariaautoreslistview
          artifacts:
            - autores-listview.zip
          target-path: app/
        - name: Livrarialivrarialistview
          artifacts:
            - livraria-listview.zip
          target-path: app/
    requires:
      - name: Livraria-auth
      - name: srv-api
      - name: Livraria-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true

  - name: Livrariaautoreslistview
    type: html5
    path: app/autores-listview
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: Livrarialivrarialistview
    type: html5
    path: app/livraria-listview
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: Livraria-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: Livraria-db

  - name: Livraria-destinations
    type: com.sap.application.content
    requires:
      - name: Livraria-auth
        parameters:
          service-key:
            name: Livraria-auth-key
      - name: Livraria-html5-repo-host
        parameters:
          service-key:
            name: Livraria-html5-repo-host-key
      - name: srv-api
      - name: Livraria-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: Livraria-html5-repository
              ServiceInstanceName: Livraria-html5-repo-host
              ServiceKeyName: Livraria-html5-repo-host-key
              sap.cloud.service: Livraria.service
            - Name: Livraria-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: Livraria-auth
              ServiceKeyName: Livraria-auth-key
              sap.cloud.service: Livraria.service
  - name: Livraria
    type: approuter.nodejs
    path: .deploy/app-router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: Livraria-auth
      - name: Livraria-destination
      - name: Livraria-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: Livraria-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: Livraria-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'vendedor-action (Livraria ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.vendedor-action'
          - name: 'admin (Livraria ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.admin'
    requires:
      - name: app-api

  - name: Livraria-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: Livraria-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: Livraria-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api
  - name: Livraria-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
